<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030907">
<title>Wingo Demo | Premium</title>
<style>
:root{--bg:#030907;--panel:#081713;--panel2:#0b211a;--green:#00f58a;--green2:#00b967;--gold:#ffd84b;--muted:#91aaa0;--line:#164b36;--red:#ff435d;--purple:#b74dff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#0b2b1d 0,#030907 48%,#010403 100%);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#f4fff9;min-height:100vh}
button,input{font:inherit}button{cursor:pointer;border:0}.app{max-width:520px;margin:auto;min-height:100vh;padding-bottom:94px;position:relative;overflow:hidden}
.top{height:66px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #143628;background:#030907dd;position:sticky;top:0;z-index:5;backdrop-filter:blur(14px)}
.logo{font-weight:1000;font-style:italic;letter-spacing:-1px;font-size:24px;color:var(--gold);text-shadow:0 0 16px #ffd84b55}.logo span{color:#fff}.top-right{display:flex;gap:9px;align-items:center}.pill{border:1px solid #236344;background:#0c281d;border-radius:20px;padding:7px 11px;color:var(--green);font-size:11px;font-weight:800}
main{padding:15px}.hero{border:1px solid #376c32;border-radius:20px;overflow:hidden;padding:21px 18px;background:radial-gradient(circle at 92% 40%,#9d7a1644,transparent 32%),linear-gradient(125deg,#073b22,#07170f 62%,#18220a);position:relative;min-height:155px;box-shadow:inset 0 0 25px #00f58a0c,0 10px 30px #0008}.hero:after{content:"✦";position:absolute;right:22px;top:16px;color:var(--gold);font-size:66px;opacity:.55}.eyebrow{color:var(--green);font-size:11px;font-weight:900;letter-spacing:2px}.hero h1{margin:9px 0 6px;font-size:25px;line-height:1.1;max-width:270px}.hero p{font-size:12px;color:#c3d9ce;margin:0 0 15px}.btn{background:linear-gradient(110deg,#28ff91,#00b866);color:#002414;border-radius:13px;padding:12px 16px;font-weight:900;box-shadow:0 5px 20px #00f58a25}.btn.small{padding:8px 12px;font-size:12px}.btn.ghost{background:#10271e;border:1px solid #24533d;color:#d9f5e6;box-shadow:none}.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 2px 11px}.section-head h2{font-size:16px;margin:0}.section-head small{color:var(--muted);font-size:11px}.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.game-card{min-height:124px;border-radius:16px;border:1px solid #277c43;background:linear-gradient(150deg,#0e5d2b,#062114);padding:12px 7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:inset 0 0 20px #4cff8210}.game-card .emoji{font-size:36px;filter:drop-shadow(0 4px 5px #0008)}.game-card b{font-size:11px;letter-spacing:.4px}.game-card small{color:#a6e5bd;font-size:9px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.stat{background:#081b14;border:1px solid #153c2b;border-radius:13px;padding:12px 10px}.stat small{color:var(--muted);font-size:10px}.stat strong{display:block;margin-top:5px;font-size:16px;color:var(--green)}
.card{background:linear-gradient(145deg,#0a2118,#06120d);border:1px solid #174831;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 8px 22px #0003}.balance-label{font-size:12px;color:var(--muted)}.balance{font-size:31px;font-weight:950;letter-spacing:-1px;margin:6px 0 13px}.coin{color:var(--gold)}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.action{border:1px solid #173e2c;background:#0a261a;color:#e8fff1;border-radius:12px;padding:11px 3px;font-size:11px}.action i{display:block;font-style:normal;font-size:20px;margin-bottom:5px}
.game-banner{padding:16px;border-radius:18px;background:linear-gradient(110deg,#07512d,#092015);border:1px solid #1d7646}.game-banner h2{margin:0 0 5px;font-size:22px}.muted{color:var(--muted);font-size:12px}.seg{display:flex;gap:5px;background:#05110c;border:1px solid #143a28;border-radius:14px;padding:5px;margin:12px 0}.seg button{flex:1;padding:10px 3px;border-radius:10px;background:transparent;color:#aac1b4;font-size:12px}.seg button.active{background:linear-gradient(100deg,#2aff91,#00b86a);color:#002515;font-weight:900}
.timer{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(100deg,#103c24,#17260e);border:1px solid #38662a;border-radius:14px;padding:13px;margin:12px 0}.timer strong{font-size:23px;color:var(--gold);font-variant-numeric:tabular-nums}.colors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 15px}.color-btn{border-radius:12px;padding:13px 4px;color:white;font-weight:900;border:2px solid transparent}.color-btn.active{border-color:white;box-shadow:0 0 15px #fff4}.green{background:#00a957}.red{background:#f33f59}.violet{background:#a63ee8}.numbers{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.num{aspect-ratio:1;border-radius:50%;background:#0a2118;border:2px solid #1cae68;color:#fff;font-weight:900;font-size:20px;box-shadow:inset 0 0 12px #00ff8714}.num:nth-child(3n+1){border-color:#a74bff}.num.active{background:var(--gold);color:#171000;border-color:#fff;transform:scale(1.04)}.join{width:100%;margin-top:15px}.notice{font-size:11px;color:#c5d8cd;background:#10271d;border:1px solid #24523a;padding:10px 12px;border-radius:12px;line-height:1.5}
.list-row{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #153528}.list-row:last-child{border:0}.list-icon{width:39px;height:39px;display:grid;place-items:center;border-radius:12px;background:#102e20;font-size:19px}.row-main{flex:1;min-width:0}.row-main b{display:block;font-size:12px}.row-main small{color:var(--muted);font-size:10px}.amount{font-size:12px;font-weight:900;color:var(--green)}.empty{text-align:center;padding:26px;color:var(--muted);font-size:12px}
.promo{background:radial-gradient(circle at 100% 0,#ffd84b35,transparent 35%),linear-gradient(120deg,#133d22,#08140e);border:1px solid #6e6525;border-radius:17px;padding:17px;margin-bottom:11px}.promo h3{margin:7px 0;font-size:17px}.promo p{color:#c6d8cb;font-size:11px;line-height:1.5}.profile{display:flex;align-items:center;gap:13px}.avatar{width:55px;height:55px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:linear-gradient(140deg,#ffd84b,#0ac96e);color:#092013;border:2px solid #ffe76e}.profile h3{margin:0 0 5px}.profile small{color:var(--muted)}
.form-field{width:100%;background:#04110b;border:1px solid #24513a;border-radius:11px;padding:13px;color:white;margin:7px 0 12px;outline:none}.form-field:focus{border-color:var(--green)}.label{font-size:12px;color:#c5d9ce}.hidden{display:none!important}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:grid;grid-template-columns:repeat(5,1fr);padding:10px 8px calc(10px + env(safe-area-inset-bottom));background:#04100df2;border-top:1px solid #19432f;backdrop-filter:blur(16px);z-index:8}.nav{background:transparent;color:#81998d;font-size:10px;padding:4px 0}.nav span{display:block;font-size:20px;margin-bottom:3px}.nav.active{color:var(--green);text-shadow:0 0 12px #00f58a66}.nav.spin span{margin-top:-20px;background:linear-gradient(135deg,#ffe66a,#c18b10);color:#15200d;border:3px solid #052b19;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;margin-left:auto;margin-right:auto;font-size:21px;box-shadow:0 0 20px #ffd84b35}.nav.spin{color:var(--gold)}
.modal-back{position:fixed;inset:0;background:#000b;z-index:20;display:grid;place-items:center;padding:18px}.modal{width:min(420px,100%);background:#07170f;border:1px solid #28794b;border-radius:20px;padding:22px;box-shadow:0 15px 60px #000b}.modal h2{margin-top:0}.modal .btn{width:100%}.toast{position:fixed;top:78px;left:50%;transform:translateX(-50%);z-index:30;background:#123c27;border:1px solid #39d985;border-radius:12px;padding:11px 16px;font-size:12px;max-width:90%;box-shadow:0 8px 24px #0008}
@media(min-width:600px){body{padding:18px 0}.app{border:1px solid #17412e;border-radius:24px;min-height:calc(100vh - 36px)}.top{border-radius:24px 24px 0 0}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="logo">WINGO<span> DEMO</span></div><div class="top-right"><span class="pill">● DEMO MODE</span><button id="authTop" class="btn small ghost">Login</button></div></header>
<main id="main"></main>
<nav class="bottom">
<button class="nav active" data-tab="Home"><span>⌂</span>Home</button>
<button class="nav" data-tab="Activity"><span>▤</span>Activity</button>
<button class="nav spin" data-tab="Game"><span>✦</span>Wingo</button>
<button class="nav" data-tab="Promotion"><span>☆</span>Promotion</button>
<button class="nav" data-tab="Account"><span>♙</span>Account</button>
</nav>
</div>
<div id="modalRoot"></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc, query, orderBy, limit, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCwzy0GWSZzdOJmrKfBvw7_11aGSXm5tsc",
  authDomain: "wingodemo.firebaseapp.com",
  projectId: "wingodemo",
  storageBucket: "wingodemo.firebasestorage.app",
  messagingSenderId: "360158308136",
  appId: "1:360158308136:web:6d6da1ff7180b631f9121d",
  measurementId: "G-SM8X4K115W"
};
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
let user=null, profile=null, tab="Home", gameMode="30Sec", selectedColor="", selectedNumber=null, history=[], countdown=30, timerId=null;
const main=document.querySelector("#main"), modalRoot=document.querySelector("#modalRoot");
const money=n=>Number(n||0).toLocaleString("en-US",{maximumFractionDigits:0});
function toast(s){const el=document.createElement("div");el.className="toast";el.textContent=s;document.body.append(el);setTimeout(()=>el.remove(),2600)}
function escapeHtml(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function loadProfile(u){const r=doc(db,"users",u.uid), snap=await getDoc(r);if(!snap.exists()){profile={name:u.email?.split("@")[0]||"Player",balance:1000,referralCode:u.uid.slice(0,7).toUpperCase(),createdAt:Date.now()};await setDoc(r,{...profile,uid:u.uid,createdAt:serverTimestamp()});}else profile=snap.data();await loadHistory();}
async function loadHistory(){if(!user)return;try{const q=query(collection(db,"users",user.uid,"history"),orderBy("createdAt","desc"),limit(20));const s=await getDocs(q);history=s.docs.map(d=>({id:d.id,...d.data()}));}catch(e){history=[];}}
function setTab(t){tab=t;document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));render();}
document.querySelectorAll(".nav").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));
document.querySelector("#authTop").addEventListener("click",()=>openAuth());
function balance(){return profile?.balance??1000}
function home(){return `<section class="hero"><div class="eyebrow">WELCOME TO YOUR ARENA</div><h1>Play Smart.<br><span style="color:var(--gold)">Have Fun.</span></h1><p>Premium gaming look. 100% virtual coins.</p><button class="btn small" data-action="game">PLAY WINGO ↗</button></section>
<div class="section-head"><h2>🎯 Game Lobby</h2><small>DEMO GAMES · 06</small></div>
<div class="games"><button class="game-card" data-action="game"><span class="emoji">🔴🟢</span><b>WINGO</b><small>Quick rounds</small></button><button class="game-card" data-action="k3"><span class="emoji">🎲</span><b>K3 LOTTERY</b><small>Demo soon</small></button><button class="game-card" data-action="5d"><span class="emoji">🔮</span><b>5D LOTTERY</b><small>Demo soon</small></button><button class="game-card" data-action="sports"><span class="emoji">⚽</span><b>SPORTS</b><small>Coming soon</small></button><button class="game-card" data-action="wheel"><span class="emoji">🎡</span><b>LUCKY WHEEL</b><small>Virtual only</small></button><button class="game-card" data-action="activity"><span class="emoji">📊</span><b>HISTORY</b><small>Recent activity</small></button></div>
<div class="section-head"><h2>💎 Your Wallet</h2><small>VIRTUAL BALANCE</small></div><div class="card"><div class="balance-label">Available demo coins</div><div class="balance"><span class="coin">◉</span> ${money(balance())} <span style="font-size:12px;color:var(--muted)">VC</span></div><div class="actions"><button class="action" data-action="wallet"><i>👛</i>Wallet</button><button class="action" data-action="bonus"><i>🎁</i>Daily bonus</button><button class="action" data-action="activity"><i>📋</i>History</button><button class="action" data-action="account"><i>♙</i>Account</button></div></div>
<div class="notice">ⓘ This is a demo experience. Coins have no cash value. No real-money deposits or withdrawals.</div>`}
function game(){return `<div class="game-banner"><div class="eyebrow">WINGO · VIRTUAL PLAY</div><h2>Fast. Simple. Exciting.</h2><div class="muted">Choose a demo round and make a virtual selection.</div></div>
<div class="seg">${["30Sec","1Min","3Min","5Min"].map(x=>`<button data-mode="${x}" class="${gameMode===x?"active":""}">${x}</button>`).join("")}</div>
<div class="timer"><div><b>Current round</b><div class="muted">Demo period #${new Date().toISOString().slice(11,19).replaceAll(":","")}</div></div><strong id="timerText">${String(Math.floor(countdown/60)).padStart(2,"0")}:${String(countdown%60).padStart(2,"0")}</strong></div>
<div class="card"><div class="section-head" style="margin-top:0"><h2>Choose a Color</h2><small>ONE SELECTION</small></div><div class="colors">${[["Green","green"],["Violet","violet"],["Red","red"]].map(([x,c])=>`<button class="color-btn ${c} ${selectedColor===x?"active":""}" data-color="${x}">${x}</button>`).join("")}</div>
<div class="section-head"><h2>Choose Number</h2><small>0–9</small></div><div class="numbers">${Array.from({length:10},(_,i)=>`<button class="num ${selectedNumber===i?"active":""}" data-num="${i}">${i}</button>`).join("")}</div>
<div style="display:flex;gap:9px;margin-top:15px"><button class="btn ghost" style="flex:1" data-action="clear">Clear</button><button class="btn join" style="flex:2;margin:0" data-action="play">PLAY DEMO</button></div></div>
<div class="notice">Demo-only outcome generated in your browser. No betting, cash prizes, deposits or withdrawals.</div>
<div class="section-head"><h2>Recent Results</h2><small>DEMO HISTORY</small></div><div class="card">${history.filter(x=>x.type==="game").slice(0,5).map(h=>`<div class="list-row"><div class="list-icon">🎯</div><div class="row-main"><b>Wingo · ${escapeHtml(h.mode||"Demo")}</b><small>${escapeHtml(h.choice||"Demo round")} · ${escapeHtml(h.date||"")}</small></div><span class="amount">${escapeHtml(String(h.result??"—"))}</span></div>`).join("")||'<div class="empty">No results yet. Play a demo round to start.</div>'}</div>`}
function activity(){return `<div class="section-head" style="margin-top:5px"><h2>📊 My Activity</h2><small>LAST 20</small></div><div class="card">${history.map(h=>`<div class="list-row"><div class="list-icon">${h.type==="game"?"🎯":h.type==="bonus"?"🎁":"🪙"}</div><div class="row-main"><b>${escapeHtml(h.title||h.type||"Activity")}</b><small>${escapeHtml(h.date||"Demo activity")}</small></div><span class="amount">${h.delta>0?"+":""}${money(h.delta||0)} VC</span></div>`).join("")||'<div class="empty">No activity yet. Your demo actions will appear here.</div>'}</div>`}
function promotion(){return `<div class="promo"><div class="eyebrow">WELCOME REWARD</div><h3>🎁 Daily Demo Bonus</h3><p>Claim 50 virtual coins once per day to explore the demo experience.</p><button class="btn small" data-action="bonus">CLAIM 50 VC</button></div><div class="card"><div class="eyebrow">INVITE YOUR FRIENDS</div><h2>Referral Rewards</h2><p class="muted">Your demo referral code</p><div style="display:flex;gap:8px;align-items:center"><input class="form-field" style="margin:0" id="refCode" readonly value="${escapeHtml(profile?.referralCode||"LOGIN REQUIRED")}"><button class="btn small" data-action="copyref">COPY</button></div><p class="muted">Referral rewards are visual/demo only. No cash value.</p></div><div class="notice">Promotions in this prototype use virtual coins only.</div>`}
function wallet(){return `<div class="card" style="background:radial-gradient(circle at 100% 0,#ffd84b22,transparent 40%),linear-gradient(140deg,#0b2a1c,#06110b)"><div class="balance-label">Total virtual balance</div><div class="balance"><span class="coin">◉</span> ${money(balance())} <span style="font-size:12px;color:var(--muted)">VC</span></div><div class="muted">Wingo Demo Wallet</div></div><div class="card"><h2 style="margin-top:0">Wallet actions</h2><div class="notice">This is a virtual wallet. It cannot accept real payments or send money.</div><button class="btn" style="width:100%;margin-top:13px" data-action="bonus">🎁 Claim demo coins</button></div><div class="section-head"><h2>Transaction History</h2></div><div class="card">${history.filter(h=>h.type!=="game").map(h=>`<div class="list-row"><div class="list-icon">${h.type==="bonus"?"🎁":"🪙"}</div><div class="row-main"><b>${escapeHtml(h.title||"Virtual transaction")}</b><small>${escapeHtml(h.date||"")}</small></div><span class="amount">+${money(h.delta||0)} VC</span></div>`).join("")||'<div class="empty">No virtual transactions yet.</div>'}</div>`}
function account(){return `<div class="card"><div class="profile"><div class="avatar">✦</div><div><h3>${escapeHtml(profile?.name||"Guest Player")}</h3><small>${user?escapeHtml(user.email):"Not signed in"}</small><div class="pill" style="display:inline-block;margin-top:7px">✦ DEMO PLAYER</div></div></div><div class="section-head"><h2>Wallet balance</h2><strong class="coin">${money(balance())} VC</strong></div><div class="actions"><button class="action" data-action="wallet"><i>👛</i>Wallet</button><button class="action" data-action="activity"><i>📋</i>History</button><button class="action" data-action="promotion"><i>🎁</i>Bonus</button><button class="action" data-action="auth"><i>🔐</i>${user?"Sign in":"Login"}</button></div></div>
<div class="card"><h3 style="margin-top:0">⚙️ Account & Support</h3>${[["👤","Edit profile","profile"],["🛡️","Security & Login","auth"],["❔","Help & Support","help"],["ℹ️","About Wingo Demo","about"]].map(([i,n,a])=>`<button class="list-row" style="background:transparent;border:0;color:white;width:100%;text-align:left" data-action="${a}"><div class="list-icon">${i}</div><div class="row-main"><b>${n}</b></div><span>›</span></button>`).join("")}${user?'<button class="btn ghost" style="width:100%;margin-top:12px" data-action="logout">LOG OUT</button>':'<button class="btn" style="width:100%;margin-top:12px" data-action="auth">LOGIN / SIGN UP</button>'}</div><div class="notice">Account data is stored in Firebase when signed in. Never share passwords or private keys.</div>`}
function render(){document.querySelector("#authTop").textContent=user?"Online":"Login";main.innerHTML=tab==="Home"?home():tab==="Game"?game():tab==="Activity"?activity():tab==="Promotion"?promotion():tab==="Wallet"?wallet():account();if(tab==="Game")startTimer();else stopTimer();}
function startTimer(){stopTimer();const total={"30Sec":30,"1Min":60,"3Min":180,"5Min":300}[gameMode];countdown=total;const el=document.querySelector("#timerText");if(el)el.textContent=`${String(Math.floor(countdown/60)).padStart(2,"0")}:${String(countdown%60).padStart(2,"0")}`;timerId=setInterval(()=>{countdown=countdown<=1?total:countdown-1;const t=document.querySelector("#timerText");if(t)t.textContent=`${String(Math.floor(countdown/60)).padStart(2,"0")}:${String(countdown%60).padStart(2,"0")}`},1000)}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function openAuth(){modalRoot.innerHTML=`<div class="modal-back"><div class="modal"><button data-close style="float:right;background:transparent;color:#aac4b5;font-size:22px">×</button><div class="logo">WINGO<span> DEMO</span></div><h2 id="authTitle">Welcome back</h2><p class="muted">Sign in or create your demo account.</p><form id="authForm"><label class="label">Email</label><input id="email" class="form-field" type="email" placeholder="you@example.com" required autocomplete="email"><label class="label">Password</label><input id="password" class="form-field" type="password" placeholder="At least 6 characters" minlength="6" required autocomplete="current-password"><button class="btn" id="authSubmit" type="submit">LOGIN</button></form><button class="btn ghost" id="toggleAuth" style="width:100%;margin-top:10px">Create new account</button><p class="muted">Demo only. Do not use a password you use elsewhere.</p></div></div>`;let signup=false;modalRoot.querySelector("[data-close]").onclick=()=>modalRoot.innerHTML="";modalRoot.querySelector("#toggleAuth").onclick=()=>{signup=!signup;modalRoot.querySelector("#authTitle").textContent=signup?"Create account":"Welcome back";modalRoot.querySelector("#authSubmit").textContent=signup?"SIGN UP":"LOGIN";modalRoot.querySelector("#toggleAuth").textContent=signup?"I already have an account":"Create new account"};modalRoot.querySelector("#authForm").onsubmit=async e=>{e.preventDefault();const email=modalRoot.querySelector("#email").value.trim(),password=modalRoot.querySelector("#password").value;try{if(signup)await createUserWithEmailAndPassword(auth,email,password);else await signInWithEmailAndPassword(auth,email,password);modalRoot.innerHTML="";toast(signup?"Account created":"Logged in");}catch(err){toast(friendlyError(err.code));}}}
function friendlyError(c){return ({"auth/email-already-in-use":"This email already has an account.","auth/invalid-credential":"Email or password is incorrect.","auth/weak-password":"Use a stronger password (at least 6 characters).","auth/invalid-email":"Check the email address.","auth/network-request-failed":"Internet connection failed."})[c]||"Could not complete. Check Firebase settings and try again."}
async function record(data){if(!user){toast("First login to save progress.");openAuth();return false}try{await addDoc(collection(db,"users",user.uid,"history"),{...data,createdAt:serverTimestamp(),date:new Date().toLocaleString()});await loadHistory();return true}catch(e){toast("Firebase write failed. Check Firestore rules.");return false}}
async function addCoins(amount,type,title){if(!user||!profile){toast("Login first to save virtual coins.");openAuth();return}try{const next=balance()+amount;await updateDoc(doc(db,"users",user.uid),{balance:next});profile.balance=next;await record({type,title,delta:amount});toast(`+${amount} virtual coins added`);render()}catch(e){toast("Could not update balance. Check Firestore rules.")}}
let lastBonusDate="";
async function play(){if(!selectedColor&&!Number.isInteger(selectedNumber)){toast("Choose a color or number first.");return}if(!user){toast("Login to save your demo history.");openAuth();return}const result=Math.floor(Math.random()*10),color=result===0||result===5?"Violet":result%2===0?"Red":"Green",choice=selectedColor||`Number ${selectedNumber}`,win=(selectedColor&&selectedColor===color)||(Number.isInteger(selectedNumber)&&selectedNumber===result);const ok=await record({type:"game",title:"Wingo Demo Round",mode:gameMode,choice,result:`${result} · ${color}`,delta:0});if(ok){toast(`Demo result: ${result} · ${color}${win?" — match!":" — round complete"}`);selectedColor="";selectedNumber=null;render()}}
main.addEventListener("click",async e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.mode){gameMode=b.dataset.mode;render();return}if(b.dataset.color){selectedColor=selectedColor===b.dataset.color?"":b.dataset.color;selectedNumber=null;render();return}if(b.dataset.num!==undefined){selectedNumber=Number(b.dataset.num);selectedColor="";render();return}const a=b.dataset.action;if(!a)return;
if(a==="game")setTab("Game");else if(a==="activity")setTab("Activity");else if(a==="account")setTab("Account");else if(a==="wallet")setTab("Wallet");else if(a==="promotion")setTab("Promotion");else if(a==="auth")openAuth();else if(a==="play")play();else if(a==="clear"){selectedColor="";selectedNumber=null;render()}else if(a==="bonus"){const today=new Date().toISOString().slice(0,10);if(lastBonusDate===today){toast("Daily demo bonus already claimed today.");return}lastBonusDate=today;await addCoins(50,"bonus","Daily demo bonus")}else if(a==="copyref"){const v=document.querySelector("#refCode")?.value||"";try{await navigator.clipboard.writeText(v);toast("Referral code copied")}catch{toast("Referral code: "+v)}}else if(a==="logout"){try{await signOut(auth);toast("Logged out")}catch{toast("Logout failed")}}else if(a==="about"){toast("Wingo Demo — virtual coins only")}else if(a==="help"){toast("For help, check your Firebase Console settings.")}else if(a==="profile"){toast("Profile editing can be added next.")}else if(["k3","5d","sports","wheel"].includes(a)){toast("This demo section is coming soon.")}});
onAuthStateChanged(auth,async u=>{user=u;if(u){try{await loadProfile(u)}catch(e){toast("Firebase connection failed. Check Firestore rules.");profile={name:u.email?.split("@")[0]||"Player",balance:1000,referralCode:u.uid.slice(0,7).toUpperCase()}}}else{profile={name:"Guest Player",balance:1000,referralCode:"LOGIN REQUIRED"};history=[]}render()});
render();
</script>
</body>
</html>
